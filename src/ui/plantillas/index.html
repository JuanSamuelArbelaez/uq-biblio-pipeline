<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Similitud de Artículos</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Mitad superior: resultados */
  #resultados {
    flex: 1;
    border-bottom: 2px solid #ccc;
    padding: 10px;
    overflow-y: auto;
  }

  /* Mitad inferior: izquierda/derecha */
  #inferior {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #izquierda, #derecha {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    box-sizing: border-box;
  }

  #izquierda {
    border-right: 2px solid #ccc;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 6px 10px;
    border: 1px solid #ddd;
    text-align: left;
  }

  tr:hover {
    background-color: #f0f0f0;
    cursor: pointer;
  }

  .articulo-item {
    border: 1px solid #aaa;
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 5px;
  }

  .articulo-header {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    cursor: pointer;
  }

  .articulo-detalle {
    display: none;
    margin-top: 5px;
  }

  .btn {
    display: inline-block;
    margin: 5px 0;
    padding: 5px 10px;
    font-size: 14px;
    background-color: #007BFF;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
  }

  .btn:disabled {
    background-color: #aaa;
    cursor: not-allowed;
  }

</style>
</head>
<body>

<div id="resultados">
  <h2>Resultados de Similitud Textual</h2>
  <div id="tabla-resultados">
    <!-- Resultados por algoritmo -->
  </div>
</div>

<div id="inferior">
  <div id="izquierda">
    <h2>Artículos disponibles</h2>
    <table id="tabla-articulos">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Autores</th>
          <th>Año</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="derecha">
    <h2>Artículos seleccionados</h2>
    <div id="lista-seleccionados"></div>
    <button id="btn-analizar" class="btn" disabled>Analizar similitud</button>
    <button id="btn-eliminar-todos" class="btn">Eliminar todos</button>
  </div>
</div>

<script>
  // === Datos de ejemplo ===
  const articulos = [
    {id: "A001", titulo: "Aprendizaje automático", autores: "Perez, Juan", año: 2023, abstract: "Estudio sobre técnicas de aprendizaje automático..."},
    {id: "A002", titulo: "Procesamiento de lenguaje natural", autores: "Gomez, Ana", año: 2022, abstract: "Explora NLP y modelos de lenguaje..."},
    {id: "A003", titulo: "Redes neuronales profundas", autores: "Lopez, Maria", año: 2024, abstract: "Análisis de redes neuronales profundas..."}
  ];

  const seleccionados = [];

  const tbody = document.querySelector("#tabla-articulos tbody");
  const listaSeleccionados = document.getElementById("lista-seleccionados");
  const btnAnalizar = document.getElementById("btn-analizar");
  const btnEliminarTodos = document.getElementById("btn-eliminar-todos");
  const tablaResultados = document.getElementById("tabla-resultados");

  // === Llenar tabla de artículos ===
  function renderTablaArticulos() {
    tbody.innerHTML = "";
    articulos.forEach(a => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${a.id}</td><td>${a.titulo}</td><td>${a.autores}</td><td>${a.año}</td>`;
      tr.addEventListener("click", () => toggleSeleccion(a));
      tbody.appendChild(tr);
    });
  }

  // === Alternar selección del artículo ===
  function toggleSeleccion(a) {
    const idx = seleccionados.findIndex(s => s.id === a.id);
    if (idx === -1) {
      seleccionados.push(a);
    } else {
      seleccionados.splice(idx, 1);
    }
    renderSeleccionados();
    btnAnalizar.disabled = seleccionados.length < 2;
  }

  // === Renderizar lista derecha ===
  function renderSeleccionados() {
    listaSeleccionados.innerHTML = "";
    seleccionados.forEach(a => {
      const div = document.createElement("div");
      div.className = "articulo-item";
      div.innerHTML = `
        <div class="articulo-header">
          <span>${a.titulo} (${a.año})</span>
          <span>+</span>
        </div>
        <div class="articulo-detalle">
          <p><strong>ID:</strong> ${a.id}</p>
          <p><strong>Autores:</strong> ${a.autores}</p>
          <p><strong>Abstract:</strong> ${a.abstract}</p>
        </div>
      `;
      const header = div.querySelector(".articulo-header");
      const detalle = div.querySelector(".articulo-detalle");
      header.addEventListener("click", () => {
        detalle.style.display = detalle.style.display === "none" ? "block" : "none";
        header.querySelector("span:last-child").textContent = detalle.style.display === "block" ? "-" : "+";
      });
      listaSeleccionados.appendChild(div);
    });
  }

  // === Eliminar todos ===
  btnEliminarTodos.addEventListener("click", () => {
    seleccionados.length = 0;
    renderSeleccionados();
    btnAnalizar.disabled = true;
  });

  // === Analizar similitud ===
  btnAnalizar.addEventListener("click", async () => {
    const abstracts = seleccionados.map(a => a.abstract);
    tablaResultados.innerHTML = "<p>Ejecutando análisis...</p>";

    // Simulación de llamada a backend / métodos de similitud textual
    // Aquí debes llamar a tus funciones de Python a través de un endpoint
    const resultados = [];

    // Por ejemplo: resultados simulados
    for (let i = 0; i < abstracts.length - 1; i++) {
      for (let j = i+1; j < abstracts.length; j++) {
        resultados.push({
          articulo1: seleccionados[i].titulo,
          articulo2: seleccionados[j].titulo,
          Levenshtein: Math.floor(Math.random()*100),
          Jaccard: Math.random().toFixed(2),
          Cosine_BOW: Math.random().toFixed(2),
          Cosine_TFIDF: Math.random().toFixed(2),
          IA: Math.random().toFixed(2)
        });
      }
    }

    // Renderizar resultados
    tablaResultados.innerHTML = "";
    resultados.forEach(r => {
      const div = document.createElement("div");
      div.innerHTML = `
        <p><strong>${r.articulo1}</strong> vs <strong>${r.articulo2}</strong></p>
        <ul>
          <li>Levenshtein: ${r.Levenshtein}</li>
          <li>Jaccard: ${r.Jaccard}</li>
          <li>Cosine BOW: ${r.Cosine_BOW}</li>
          <li>Cosine TF-IDF: ${r.Cosine_TFIDF}</li>
          <li>IA: ${r.IA}</li>
        </ul>
        <hr>
      `;
      tablaResultados.appendChild(div);
    });
  });

  renderTablaArticulos();
</script>

</body>
</html>
